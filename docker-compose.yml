
services:
  database-cardiotrustai:
    image: postgres:15
    container_name: cardiotrustai-postgres
    restart: always
    environment:
      POSTGRES_DB: CardioTrustAIDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CardioTrustAI123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cardiotrustai-network

  cardiotrustai-service:
    container_name: cardiotrustai-container
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "2029:2029"
    depends_on:
      - database-cardiotrustai
    environment:
      DB_HOST: database-cardiotrustai
      DB_PORT: "5432"
      DB_NAME: CardioTrustAIDb
      DB_USER: postgres
      DB_PASS: CardioTrustAI123!

      ASPNETCORE_URLS: http://+:2029
      APPLICATION_URL: https://localhost:7242

    networks:
      - cardiotrustai-network

volumes:
  postgres_data:

networks:
  cardiotrustai-network:
    driver: bridge
